<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muhammad Hammad - Portfolio</title>
  <style>
    /* Reset & Base Layout */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b132b; /* Dark background */
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Hero Section Container (Centering Everything) */
    .hero-container {
      max-width: 700px;
      width: 100%;
      text-align: center;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Fixed Profile Image Styling */
    .profile-img {
      width: 180px !important;
      height: 180px !important;
      max-width: 180px;
      max-height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #3b82f6;
      box-shadow: 0 0 25px rgba(59, 130, 246, 0.5);
      margin-bottom: 20px;
      display: block;
    }

    /* Content Styling */
    .hero-title {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .hero-subtitle {
      font-size: 1.3rem;
      color: #60a5fa;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .hero-description {
      font-size: 1rem;
      line-height: 1.6;
      color: #d1d5db;
      margin-bottom: 25px;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .btn {
      padding: 12px 30px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 25px;
      text-decoration: none;
      color: #ffffff;
      background-color: #2563eb;
      transition: all 0.3s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    .btn:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <!-- Image Profile -->
    <img src="profile.jpg" alt="Muhammad Hammad" class="profile-img">

    <!-- Content -->
    <h1 class="hero-title">Hi, I'm Muhammad Hammad</h1>
    <h2 class="hero-subtitle">CRM & Automation Specialist</h2>
    <p class="hero-description">
      Helping businesses streamline workflows with Housecall Pro, ServiceTitan, Zoho CRM, Data Migration & API Integrations.
    </p>

    <!-- Buttons -->
    <div class="btn-group">
      <a href="#hire" class="btn">Hire Me</a>
      <a href="#contact" class="btn">Contact Me</a>
    </div>
  </div>

</body>
</html>
